services:
  vauxtra:
    build: .
    image: vauxtra:local
    # To pull the pre-built GHCR image instead of building from source:
    # image: ghcr.io/ptitzgeg-on-git/vauxtra:latest
    container_name: vauxtra
    restart: unless-stopped
    security_opt:
      # Nothing inside this container ever needs to gain a privilege it was not started
      # with. The entrypoint starts as root on purpose -- it has to chown the data volume
      # and add `appuser` to the group that owns the Docker socket, whose GID is only known
      # at run time -- and then hands the server over with `gosu appuser`. That handover is
      # a plain setuid/setgid syscall made by root, which this flag does not touch; what it
      # does forbid is the opposite direction, a setuid binary handing privilege back after
      # the drop.
      - no-new-privileges:true
    # Not set, and deliberately: `read_only: true` and `cap_drop: ALL` both break the
    # entrypoint. It writes `/etc/group` and `/etc/passwd` to grant the Docker socket's
    # group, and chowns `/app/data` -- so it needs a writable root filesystem and CHOWN,
    # DAC_OVERRIDE, FOWNER, SETUID and SETGID. Hardening past this point means moving that
    # work out of the container, not switching the flags on and finding out at the next
    # restart.
    ports:
      # The loopback by default. This panel holds provider credentials -- Cloudflare
      # tokens, proxy manager passwords -- and it has no password of its own until the
      # setup wizard is completed. `"8888:8888"` would publish it on every interface of
      # the host from the first `up -d`, which on a home network is every device on the
      # LAN. Set VAUXTRA_BIND to 0.0.0.0, or to one interface address, to widen it on
      # purpose.
      - "${VAUXTRA_BIND:-127.0.0.1}:8888:8888"
    volumes:
      - ./data:/app/data
      # Container discovery. `:ro` applies to the socket *file*, not to the Docker API:
      # anything that can talk to this socket can start a privileged container and is
      # therefore root on the host. Vauxtra only ever lists and inspects, but the grant is
      # not what Vauxtra does with it. Remove this line if you do not use the Docker
      # features -- everything else keeps working, the Docker screens answer 503 -- or put
      # a read-only socket proxy in front of it and point DOCKER_HOST at that instead.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8888/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
