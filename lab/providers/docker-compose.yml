name: vauxtra-providers-lab

services:
  pihole:
    image: pihole/pihole:latest
    container_name: vauxtra-pihole
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - WEBPASSWORD=${PIHOLE_WEBPASSWORD}
    ports:
      - "18081:80"
    volumes:
      - ./state/pihole/etc-pihole:/etc/pihole
      - ./state/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    networks:
      - providers_lab

  adguard:
    image: adguard/adguardhome:latest
    container_name: vauxtra-adguard
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    ports:
      - "13000:3000"
    volumes:
      - ./state/adguard/work:/opt/adguardhome/work
      - ./state/adguard/conf:/opt/adguardhome/conf
    networks:
      - providers_lab

  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: vauxtra-npm
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - INITIAL_ADMIN_EMAIL=${NPM_INITIAL_EMAIL}
      - INITIAL_ADMIN_PASSWORD=${NPM_INITIAL_PASSWORD}
    ports:
      - "18080:80"
      - "18443:443"
      - "18082:81"
    volumes:
      - ./state/npm/data:/data
      - ./state/npm/letsencrypt:/etc/letsencrypt
    networks:
      - providers_lab

  technitium:
    image: technitium/dns-server:latest
    container_name: vauxtra-technitium
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - DNS_SERVER_ADMIN_PASSWORD=${TECHNITIUM_ADMIN_PASSWORD}
    ports:
      - "15389:5380"
    volumes:
      - ./state/technitium/config:/etc/dns
    networks:
      - providers_lab

  traefik:
    image: traefik:v3.1
    container_name: vauxtra-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:8081"
    ports:
      - "18083:8081"
      - "18090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - providers_lab

  whoami:
    image: traefik/whoami:latest
    container_name: vauxtra-whoami
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=PathPrefix(`/`)"
      - "traefik.http.routers.whoami.entrypoints=web"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
    networks:
      - providers_lab

networks:
  providers_lab:
    name: vauxtra_providers_lab
