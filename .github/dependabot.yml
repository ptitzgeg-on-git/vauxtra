# Deleted in 18392d1 (the v1.1.0 release commit) and not replaced. Nothing watched the
# dependencies for the three months that followed: main reached 27 advisories, 10 of them
# high, and `npm audit --audit-level=high` -- a required step of the weekly scan -- was red
# the whole time for a fix that was one `npm update` away.
#
# The reason it was deleted was noise: three ecosystems at five PRs each is a flood nobody
# reads, and a flood nobody reads is the same as no alert at all. So everything below is
# grouped -- one PR per ecosystem per week for the routine version bumps, and separate PRs
# only for major versions, which are the ones that actually need a human.
# Every ecosystem below targets `dev`, not `main`. A dependency bump is a change like
# any other: it belongs on the integration branch, where it is built, scanned and run
# against a staging instance before a human moves it into production. Opening these
# against `main` meant the only thing between a new major version and the release
# branch was whether anyone read the diff that morning.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, python]
    groups:
      python-minor:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dependencies, javascript]
    groups:
      npm-minor:
        patterns: ["*"]
        update-types: [minor, patch]
    # TypeScript 7 cannot be installed here yet, and the PR for it is not a diff anyone can
    # review: `npm ci` aborts with ERESOLVE before a single file is linted, because
    # `typescript-eslint` still declares `typescript@">=4.8.4 <6.1.0"` as a peer and has
    # published no major above 8. Reopening that PR every week produces a red build with no
    # decision attached to it. Remove this entry as soon as typescript-eslint ships a release
    # whose peer range admits 7.x -- the bump is wanted, only its blocker is upstream.
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  # `pip` and `npm` watch what the application imports; neither of them watches what it
  # runs on. The Dockerfile pins `node:22-slim` and `python:3.13-slim`, and a base image
  # is where a CVE lands without a single line of this repository changing -- the weekly
  # Trivy and Grype scans report those findings against an image nobody was updating.
  # Monthly, because a base image tag moves on its own schedule and a weekly PR for it
  # would be the noise this file was rewritten to avoid.
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    labels: [dependencies, build]
    groups:
      docker:
        patterns: ["*"]
