name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Called by Build & Publish so that no image is ever pushed and signed before this
  # workflow is green. Tag pushes reach the tests only through this call: they match none
  # of the branch triggers above.
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# This workflow runs code from every branch that is pushed. It needs to read the tree and
# nothing else, and it was the only workflow in the repository not saying so -- which left
# the token on whatever the repository default happens to be.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      # The hygiene gate judges the identity of every commit in the history, and
      # `checkout` fetches exactly one by default. On that default the gate would read
      # the tip, say nothing about everything behind it, and report green -- which is
      # how two names nobody invited ended up on the front page of this repository. It
      # now refuses to rule on a shallow clone, so this line is what keeps it able to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile check
        run: python -m py_compile app/*.py app/api/*.py app/providers/*.py app/services/*.py vauxtra_mcp/*.py vauxtra_mcp/tools/*.py

      # The whole repository, not just the shipped code: a test that no longer compiles or
      # imports a module it stopped using is a test nobody reads any more.
      - name: Ruff lint
        run: ruff check .

      - name: API-MCP parity gate
        run: python scripts/check_api_mcp_parity.py

      - name: Repo hygiene gate
        run: python scripts/check_repo_hygiene.py

      - name: Run tests
        run: python -m pytest tests/ -v

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: ESLint
        run: cd frontend && npm run lint

      - name: TypeScript check
        run: cd frontend && npx tsc --noEmit

      - name: Build
        run: cd frontend && npm run build

      # Key parity across the eight locales. The repository has carried this script since
      # v1.0 and CI never ran it, so a key added to en.json alone reached production and the
      # UI printed its raw name to the operator.
      - name: Locale key parity
        run: cd frontend && npm run i18n:check

      - name: Locale semantic quality
        run: cd frontend && npm run i18n:quality

      # Three PRs in a row shipped with the same caveat in their body: the defect they fixed
      # could only be reproduced by hand, because nothing here ever rendered a component.
      - name: Unit tests
        run: cd frontend && npm run test
