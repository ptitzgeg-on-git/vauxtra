# Every release page on this repository was written by hand, and it showed: three of them
# advertised a `docker pull` for an image that is not in the registry, and one release was
# missing entirely for a version the changelog documents. Both are the same class of
# mistake, a page that asserts something nobody re-checked at the moment of publishing.
#
# So this workflow refuses to write the `docker pull` line until it has pulled the manifest
# itself, all the way down to the platform images. If the tag does not resolve, the release
# is not created and the run goes red. A missing release page is a nuisance; a release page
# promising a command that fails is a trap, and this repository has already set three.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  # A tag can only be pushed once, so a run that dies on something other than the
  # tag itself -- a bug in this file, a registry hiccup -- used to leave no way to
  # produce the page short of moving the tag. This input is that way back.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v1.5.0"
        required: true
        type: string

# Never `cancel-in-progress`. Two runs here would be two writers on the same registry tag
# or the same release page, so they queue instead -- and a run that is already pushing,
# signing or attesting is never the one to kill.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    # A job with no ceiling can hold its concurrency group for GitHub's default of six
    # hours, so it needs one. But a ceiling BELOW the wait it contains is worse than no
    # ceiling: it was 20 against a 30-minute wait, so the wait could never reach its own
    # deadline and the run died on "exceeded the maximum execution time of 20 minutes"
    # instead of printing which manifest was missing and what to do about it. The wait
    # reads its budget from `PULL_WAIT_MINUTES` below; keep this ceiling well above it.
    # (The comment that used to sit here said this job is not on the push path. It is:
    # `push: tags` at the top of this file is its main trigger.)
    timeout-minutes: 40
    env:
      PULL_WAIT_MINUTES: "30"

    steps:
      # On a tag push the tag is the ref; on a manual run it is the input. Everything
      # downstream reads these two outputs and never `github.ref_name`, so the two
      # entry points cannot drift apart.
      #
      # `docker/metadata-action` strips the leading `v`, so git tag `v1.4.0` becomes image
      # tag `1.4.0`. Getting this backwards is why `:v1.4.0` is not a thing you can pull.
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$tag' is not a v<major>.<minor>.<patch> tag"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tag: $tag, image tag: ${tag#v}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      # Build & Publish is triggered by the same tag push and runs in parallel. Two
      # architectures plus attestations take a while, so this waits rather than racing it.
      - name: Wait for the image to be pullable
        env:
          PACKAGE: ${{ github.repository }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, sys, time, urllib.error, urllib.request

          repo, tag = os.environ["PACKAGE"].lower(), os.environ["VERSION"]
          accept = ",".join([
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          ])

          def get(url, headers):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as r:
                  return json.load(r)

          def resolves():
              # A fresh token each attempt: these are short-lived and the wait is not.
              token = get(
                  f"https://ghcr.io/token?scope=repository:{repo}:pull&service=ghcr.io", {}
              )["token"]
              head = {"Authorization": f"Bearer {token}", "Accept": accept}
              try:
                  index = get(f"https://ghcr.io/v2/{repo}/manifests/{tag}", head)
              except urllib.error.HTTPError as e:
                  return f"index: HTTP {e.code}"
              children = index.get("manifests", [])
              if not children:
                  return "index lists no manifests"
              for m in children:
                  try:
                      get(f"https://ghcr.io/v2/{repo}/manifests/{m['digest']}", head)
                  except urllib.error.HTTPError as e:
                      return f"child {m['digest'][:19]}: HTTP {e.code}"
              return None

          # Derived from the job ceiling rather than written next to it and forgotten.
          DEADLINE, STEP = int(os.environ["PULL_WAIT_MINUTES"]) * 60, 30
          waited = 0
          while True:
              why = resolves()
              if why is None:
                  print(f"{tag} resolves to every manifest it references")
                  break
              if waited >= DEADLINE:
                  print(f"::error::{tag} is still not pullable after {DEADLINE // 60} "
                        f"minutes: {why}")
                  print("::error::no release page will be created for an image that does "
                        "not exist -- fix the build, then re-run this workflow")
                  sys.exit(1)
              print(f"  not yet ({why}), {waited}s elapsed")
              time.sleep(STEP)
              waited += STEP
          PY

      - name: Assemble the release body
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import io, json, os, re, subprocess

          version, tag = os.environ["VERSION"], os.environ["TAG"]
          repo = os.environ["REPO"]

          # The tag before this one, so the generated notes cover the right range.
          tags = subprocess.run(
              ["git", "tag", "--sort=-v:refname"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          previous = tags[tags.index(tag) + 1] if tag in tags[:-1] else None

          payload = {"tag_name": tag}
          if previous:
              payload["previous_tag_name"] = previous
          # No `--jq` here: it prints a string field raw, and raw Markdown is not JSON.
          # Parse the whole response and read the field, which is.
          generated = json.loads(subprocess.run(
              ["gh", "api", f"repos/{repo}/releases/generate-notes", "--input", "-"],
              input=json.dumps(payload), capture_output=True, text=True, check=True,
          ).stdout or "{}").get("body") or ""

          # The changelog section for this version, if the release commit added one.
          with io.open("CHANGELOG.md", encoding="utf-8") as f:
              changelog = f.read()
          section = re.search(
              r"^## \[" + re.escape(version) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)",
              changelog, re.S | re.M,
          )
          notes = (section.group(1).strip() if section else "").strip("-").strip()

          # A release body is capped at 125000 characters, and 1.5.0's changelog
          # section alone is 287183: a version that collects a long backlog would
          # otherwise be rejected by the API at the very last step. Past the cap the
          # page links to the file instead of trying to quote it.
          BODY_MAX, NOTES_MAX = 125000, 30000
          if len(notes) > NOTES_MAX:
              notes = (
                  f"This version's changelog section is {len(notes)} characters, more "
                  "than a release page can hold. Read it in full in "
                  f"[CHANGELOG.md](https://github.com/{repo}/blob/{tag}/CHANGELOG.md)."
              )

          parts = [
              "## Docker Image\n",
              "```bash",
              f"docker pull ghcr.io/{repo.lower()}:{version}",
              "```",
              "",
              "Verified pullable on both `linux/amd64` and `linux/arm64` before this page was "
              "created.",
              "",
          ]
          if notes:
              parts += ["## Changelog\n", notes, ""]
          if generated:
              parts += [generated]
          body = "\n".join(parts)
          if len(body) > BODY_MAX:
              print(f"::error::the assembled body is {len(body)} characters, over the "
                    f"{BODY_MAX} a release page accepts")
              raise SystemExit(1)
          with io.open("RELEASE_BODY.md", "wb") as f:
              f.write(body.encode("utf-8"))
          print(f"body: {len(body)} characters")
          print(body[:2000])
          PY

      # `make_latest: legacy` asks GitHub to pick the latest release by version rather than
      # by creation date. Creating a retroactive tag for an old version otherwise hands it
      # the "Latest" badge, which is how `v1.0.0` briefly outranked `v1.4.0`.
      - name: Create the release
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::a release already exists for $TAG; delete it first to redo it"
            exit 1
          fi
          gh api "repos/$REPO/releases" \
            -f tag_name="$TAG" \
            -f name="$TAG" \
            -f body="$(cat RELEASE_BODY.md)" \
            -f make_latest=legacy \
            --jq '"created: \(.html_url)  latest=\(.tag_name)"'
