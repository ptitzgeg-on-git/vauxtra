name: Security Scan

on:
  # Every branch, not just main: a scan that only runs once the code has already landed
  # tells you about a problem you now have, instead of one you were about to create.
  # `main` and `dev` are deliberately excluded here -- on both of them this workflow runs
  # as the Build & Publish gate, so it runs exactly once per push instead of twice.
  push:
    branches-ignore: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 3 * * 1"  # every Monday at 03:00 UTC
  # Called by Build & Publish: the image is not pushed until this is green.
  workflow_call:
  workflow_dispatch:

# A pull request triggers this workflow twice -- once on `push` and once on
# `pull_request` -- and pushing three commits in a row leaves four runs nobody will read.
# Superseded runs of the same pull request are cancelled.
#
# Everything else keys on `github.run_id`, which is unique, so those runs share a group
# with nothing and can never queue. That is not tidiness, it is the whole point: inside a
# reusable workflow `github.workflow` is the name of the *caller*, so keying on it put this
# workflow in Build & Publish's own group when Build & Publish called it as a gate. The
# caller held the group and waited for the gate; the gate waited for the group. No job was
# ever created and the publish chain failed on `ddcd703` with nothing in the log to read.
concurrency:
  group: security-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # The hygiene gate judges the identity of every commit in the history, and
      # `checkout` fetches exactly one by default. On that default the gate would read
      # the tip, say nothing about everything behind it, and report green -- which is
      # how two names nobody invited ended up on the front page of this repository. It
      # now refuses to rule on a shallow clone, so this line is what keeps it able to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: pip-audit (Python dependencies)
        run: |
          python -m pip install pip-audit
          python -m pip_audit --requirement requirements.txt

      # Through a runner, because `npm audit` exits 1 both when the registry reports a
      # high-severity advisory and when the registry reports nothing at all. The runner
      # reads the report rather than the exit code, retries a registry that will not
      # answer, and -- if it never does -- fails while saying that nothing was audited.
      - name: npm audit (frontend dependencies)
        run: |
          cd frontend && npm ci && cd ..
          python scripts/run_npm_audit.py --audit-level=high

      - name: API-MCP parity gate
        run: python scripts/check_api_mcp_parity.py

      - name: Repo hygiene gate
        run: python scripts/check_repo_hygiene.py

  # Two gaps, one job. Nothing in this repository ever ran `docker build` outside the
  # publish step, so a Dockerfile that does not build was discovered at the worst possible
  # moment: on a tag, after tests and this scan had both gone green, with the version
  # already public in git and no image to go with it. And every scanner here reads the
  # *source tree* -- Trivy over the working copy, Grype over an SBOM of the working copy --
  # so the thing operators actually run was the one thing nobody looked at. `python:
  # 3.13-slim` is a Debian userland: a critical openssl or zlib advisory lands in the
  # shipped image without touching a single line of this repository, and none of the steps
  # below the source scan would have said a word about it.
  #
  # One platform on purpose. This proves the build and scans the userland, both of which
  # are architecture-independent here; the multi-arch build stays where the publish is, and
  # shares this job's layer cache when it gets there.
  image-scan:
    name: Image build & scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: vauxtra:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — image scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: vauxtra:scan
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          # Same reasoning as the filesystem scan: without this, trivy never receives
          # `--exit-code` and reports success whatever it finds.
          exit-code: "1"
          # A base-image CVE with no fixed version yet is not something this repository can
          # act on, and a gate nobody can turn green is a gate people learn to bypass. The
          # finding still reaches the Security tab through the upload below.
          ignore-unfixed: true

      - name: Upload image scan results to Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always() && hashFiles('trivy-image-results.sarif') != '' && !startsWith(github.ref, 'refs/tags/')
        with:
          sarif_file: trivy-image-results.sarif
          category: trivy-image

  vuln-scan:
    name: Vulnerability scan (Trivy + Grype)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `exit-code` is declared `required: false` with no `default:` in trivy-action's
      # action.yaml, so leaving it out means the `--exit-code` flag is never passed and
      # trivy exits 0 whatever it finds. The job is named "Vulnerability scan" and filters
      # on CRITICAL,HIGH: everything about it said "gate", and half of it was a report.
      # The SARIF upload below runs `if: always()`, so the findings still reach the
      # Security tab when this step breaks the build.
      - name: Trivy — filesystem scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always() && !startsWith(github.ref, 'refs/tags/')
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Syft's requirements.txt parser drops every line whose constraint is not an exact
      # pin, and its default config sets GuessUnpinnedRequirements to false. All thirteen
      # lines of requirements.txt use `>=`. The SBOM therefore contained zero Python
      # packages, and Grype -- the only step in this pipeline that actually breaks the
      # build -- had nothing at all to compare on the backend side. Installing the
      # dependencies first gives Syft real dist-info metadata, with the versions that are
      # genuinely resolved rather than the floor of a range.
      - name: Materialise the Python dependencies for the SBOM
        run: |
          python -m venv .sbom-venv
          ./.sbom-venv/bin/python -m pip install --quiet --upgrade pip
          ./.sbom-venv/bin/python -m pip install --quiet -r requirements.txt

      # `upload-release-assets` defaults to true, and on a tag ref the action then tries to
      # attach the SBOM to the GitHub release. It cannot work here whatever the permissions:
      # this job is the gate that runs BEFORE build-and-push, which runs before the release
      # is created -- so the asset has no release to land on, and the step fails the whole
      # publish. The SBOM already leaves as a workflow artifact, which is what we read.
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom.cyclonedx.json
          upload-release-assets: false

      # The defect this pipeline shipped with was not a wrong number, it was an empty
      # section nobody thought to look at: a scanner reporting success over a blind spot.
      # If either ecosystem disappears from the SBOM again, this says so and stops.
      - name: The SBOM must contain both ecosystems
        run: |
          py=$(jq '[.components[]? | select((.purl // "") | startswith("pkg:pypi/"))] | length' sbom.cyclonedx.json)
          js=$(jq '[.components[]? | select((.purl // "") | startswith("pkg:npm/"))] | length' sbom.cyclonedx.json)
          echo "SBOM contents: $py Python packages, $js npm packages"
          if [ "$py" -lt 10 ] || [ "$js" -lt 10 ]; then
            echo "::error::An ecosystem is missing from the SBOM. Grype would scan a blind spot and report success."
            exit 1
          fi

      # A pinned scanner expires the way a certificate does. v0.96.0 could no longer
      # read the vulnerability database anchore publishes -- `grype db update` died on
      # `UNIQUE constraint failed: operating_systems...` while migrating it -- so the
      # weekly scan was red for a reason that had nothing to do with this repository.
      # Dependabot does not watch this: `github-actions` follows `uses:` refs, not a
      # version in an `env:` block. Check it by hand when this job goes red on a
      # database error rather than on a finding.
      - name: Install Grype
        env:
          GRYPE_VERSION: v0.118.0
        run: |
          # The installer used to be piped straight from the `main` branch: the grype
          # version was pinned, the script that fetches it was not, so a change pushed to
          # that branch would have executed here with this job's privileges. Fetching it
          # from the same tag as the binary makes both immutable, and install.sh still
          # verifies the binary against the release checksums.
          curl -sSfL -o "$RUNNER_TEMP/grype-install.sh" \
            "https://raw.githubusercontent.com/anchore/grype/$GRYPE_VERSION/install.sh"
          sh "$RUNNER_TEMP/grype-install.sh" -b /usr/local/bin "$GRYPE_VERSION"

      - name: Grype — scan SBOM (SARIF)
        id: grype
        run: |
          # `grype db update` sits outside the `set +e` on purpose. It used to be inside,
          # so a failed database download let the scan run without a database, fail, and
          # be reported by the step below as "Grype found vulnerabilities" -- sending the
          # operator to read an empty report while the real cause was the network.
          grype db update
          set +e
          grype sbom:sbom.cyclonedx.json --fail-on high -o sarif > grype-results.sarif
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          # The redirection creates the file even when grype writes nothing into it, which
          # defeated the `hashFiles(...) != ''` guard on the upload step below.
          [ -s grype-results.sarif ] || rm -f grype-results.sarif
          if [ "$rc" -gt 1 ]; then
            echo "::error::grype exited $rc: it failed to run. This is not a vulnerability report."
            exit "$rc"
          fi
          exit 0

      - name: Upload Grype results to Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always() && hashFiles('grype-results.sarif') != '' && !startsWith(github.ref, 'refs/tags/')
        with:
          sarif_file: grype-results.sarif
          category: grype

      # Exactly 1 -- that is what `--fail-on high` returns when it finds something. Any
      # other non-zero code is grype failing to run, and is raised by the step above with
      # a message that says so.
      - name: Enforce Grype policy
        if: steps.grype.outputs.exit_code == '1'
        run: |
          echo "::error::Grype found vulnerabilities at or above the 'high' cutoff. See the Security tab."
          exit 1
