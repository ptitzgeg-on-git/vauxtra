# Deleting "untagged" versions from a multi-arch package is not the housekeeping it looks
# like. Every `docker buildx` push writes one *tagged* manifest list -- `1.3.0`, `latest` --
# and several untagged manifests underneath it: one per platform, plus the provenance and
# SBOM attestations. Those children are what the tag actually resolves to, and the registry
# lists them as untagged because nothing points a name at them directly.
#
# `actions/delete-package-versions` cannot see that structure. With
# `delete-only-untagged-versions: true` and `min-versions-to-keep: 10` it kept the ten most
# recent untagged versions and deleted the rest -- and a single build produces three or four
# of them, so ten covers roughly the last three pushes. Everything older lost its per-platform
# manifests while the tag survived, which is the worst of the two possible failures: `docker
# pull ghcr.io/ptitzgeg-on-git/vauxtra:1.2.0` fails with `manifest unknown` on a tag the
# package page still lists, whose release notes still name it, and whose cosign signature
# still verifies. The signature was never a claim that the image is *there*.
#
# `dataaxiom/ghcr-cleanup-action` reads the manifest lists before deleting anything, so a
# child referenced by any surviving tag is never a candidate.
#
# That stops the bleeding; it does not report the wound. A dry run on 2026-09-11 found 48
# images with at least one missing child, three of them carrying a release tag -- `0.1.0`,
# `1.0.1` and `1.0.2` could not be pulled, on a package page that still listed them.
# `validate: true` names every one of them and the run still ends green, because the action
# writes `::warning` and not `::error`. A check nobody is paged for is a check that does not
# exist, which is why the damage sat there across every Sunday since it was done.
#
# So the last step below re-asks the only question that has a user behind it: does every
# version a human is invited to pull still resolve, all the way down to its platform
# manifests? It fails the run when the answer is no. The `sha-<commit>` breadcrumbs are
# deliberately outside its scope: nothing reads them, and the settings below now retire
# them on their own rather than letting five months of them pile up again.
#
# The three broken releases have since been withdrawn rather than repaired, along with the
# rest of the pre-1.1 line, so nothing on the package page points at them any more. Read
# anonymously from the registry on 2026-09-20: the package holds `dev`, `latest` and eleven
# version tags from `1.1.0` to `1.5.0`, and every one of them resolves to all four of the
# manifests it references. The same morning's scheduled run deleted 423 versions and the
# step below reported twelve pullable tags, all green. This header used to describe the
# damage in the present tense; the damage is gone, and what remains is the guard.
name: GHCR Cleanup

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would be deleted without deleting it"
        type: boolean
        default: false

# Never `cancel-in-progress`. Two runs here would be two writers on the same registry tag
# or the same release page, so they queue instead -- and a run that is already pushing,
# signing or attesting is never the one to kill.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  cleanup:
    name: Delete orphaned container versions
    runs-on: ubuntu-latest
    # A job with no ceiling can hold its concurrency group for GitHub's default of six
    # hours. This one is not on the push path, so the ceiling is simply a backstop.
    timeout-minutes: 20
    permissions:
      packages: write

    steps:
      - name: Delete GHCR versions no tag references
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: vauxtra
          # The one rule everything else is subordinate to: a tag a human can be invited to
          # pull is never a candidate, whatever state the registry reports it in. `latest`,
          # `dev` and every dotted version number are excluded by name here, so
          # `delete-ghost-images` below can never quietly retire a tag the package page
          # still offers. Withdrawing one is a decision for a person, not for a cron job;
          # that is how the pre-1.1 line went, by hand and on purpose.
          use-regex: true
          # `^(latest|\d+(\.\d+)*)$` is the obvious way to write this and the action rejects
          # it: a quantified group inside a quantifier is a ReDoS shape, and it refuses to
          # run rather than hand an attacker-controlled tag name to a backtracking engine.
          # A flat character class says the same thing about the tags that exist here --
          # every other tag is `sha-<hex>` or `sha256-<hex>.sig`, neither of which is
          # digits and dots -- with no nesting to back track through. `dev` is a moving tag
          # that a staging instance pulls on every restart, so it belongs in this list for
          # the same reason `latest` does: something is pointed at it right now.
          exclude-tags: '^(latest|dev|[0-9.]+)$'
          # Untagged *and* unreferenced. This action resolves every manifest list first, so
          # a platform manifest belonging to a live tag is not a candidate however untagged
          # the registry reports it.
          delete-untagged: true
          # Everything not excluded above is machine bookkeeping: the `sha-<short>`
          # breadcrumb from each `main` build and the cosign signature that follows it.
          # Twenty of them were deleted by hand on 2026-09-11 after five months of
          # accumulation; keeping the most recent dozen means that is the last time anyone
          # has to do it by hand.
          keep-n-tagged: 12
          # Three shapes of debris the old cleanup left behind and no schedule was removing:
          # an image whose platform manifests are all gone, one missing only some of them,
          # and a cosign signature or attestation whose subject no longer exists. All three
          # are invisible on the package page and all three still take up a row in it.
          delete-ghost-images: true
          delete-partial-images: true
          delete-orphaned-images: true
          # A margin against racing a push that is still settling. Sunday at 04:00 should
          # not be looking at Saturday night's build at all.
          older-than: 7 days
          # Walks every multi-architecture manifest afterwards and names each digest it
          # cannot find. Worth keeping for the detail it prints, but it reports through
          # `::warning`, so it cannot turn a run red on its own -- see the step below.
          validate: true
          dry-run: ${{ inputs.dry_run == true }}

      - name: Every pullable tag must still resolve
        env:
          PACKAGE: ${{ github.repository }}
        run: |
          # `-u` for the same reason as the wait in `release.yml`: Python block-buffers
          # stdout when it is a pipe, and this step prints one line per tag as it walks
          # roughly fifty manifests. Buffered, the whole walk lands at once at the end,
          # which is no use while it runs and no use at all if it is cut short.
          python3 -u - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request

          repo = os.environ["PACKAGE"].lower()
          accept = ",".join([
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
              "application/vnd.oci.image.manifest.v1+json",
              "application/vnd.docker.distribution.manifest.v2+json",
          ])

          def get(url, headers):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers)) as r:
                  return json.load(r)

          token = get(
              f"https://ghcr.io/token?scope=repository:{repo}:pull&service=ghcr.io", {}
          )["token"]
          head = {"Authorization": f"Bearer {token}", "Accept": accept}

          def manifest(ref):
              try:
                  return get(f"https://ghcr.io/v2/{repo}/manifests/{ref}", head)
              except urllib.error.HTTPError as e:
                  return e.code

          # A tag something pulls: a version number, `latest`, or `dev`. The
          # `sha-<commit>` breadcrumbs and the `sha256-....sig` signatures are machine
          # bookkeeping and are not part of this contract.
          #
          # `dev` belongs here and was missing from it. The list above excludes it from
          # deletion precisely because a staging instance pulls it on every restart, which
          # is the definition this set is supposed to encode -- yet the pattern below
          # admitted only `latest` and dotted numbers, so the one moving tag with a machine
          # waiting on it was the one tag nobody verified. It would have broken in silence
          # and been found by a restart.
          #
          # There used to be an UNRECOVERABLE set here, six tags this check skipped because
          # their platform manifests had been destroyed before it existed and failing every
          # Sunday over them would have trained everyone to ignore the step. Those releases
          # have since been withdrawn: read anonymously on 2026-09-20, not one of the six is
          # in the registry, so the set excluded nothing and the `::notice::` announcing it
          # had stopped printing. A silent exception list that no longer matches anything is
          # worse than none, because the next break to touch one of those names would be
          # waved through by a rule written for a different break. If one ever has to come
          # back, it comes back with the date and the reason, not inherited from this file.
          tags = get(f"https://ghcr.io/v2/{repo}/tags/list?n=1000", head)["tags"]
          pullable = sorted(
              t for t in tags
              if t in ("latest", "dev") or re.fullmatch(r"\d+(\.\d+)*", t)
          )
          print(f"checking {len(pullable)} pullable tags: {', '.join(pullable)}\n")

          broken = []
          for tag in pullable:
              index = manifest(tag)
              if isinstance(index, int):
                  broken.append(f"{tag}: index itself returns HTTP {index}")
                  continue
              missing = [
                  m["digest"]
                  for m in index.get("manifests", [])
                  if isinstance(manifest(m["digest"]), int)
              ]
              if missing:
                  broken.append(
                      f"{tag}: {len(missing)}/{len(index['manifests'])} platform manifests missing"
                  )
                  for d in missing:
                      print(f"::error::{tag} references {d}, which the registry does not have")
              else:
                  print(f"  ok  {tag}")

          if broken:
              print("\n::error::a published tag cannot be pulled:")
              for b in broken:
                  print(f"  {b}")
              sys.exit(1)
          print("\nevery pullable tag resolves to every manifest it references")
          PY
