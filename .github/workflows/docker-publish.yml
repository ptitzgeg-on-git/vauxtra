name: Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # `build-and-push` had no `needs:` at all. Tests, Security Scan and this workflow all
  # trigger on the same push and started in parallel, so an image was pushed to `latest`,
  # signed with the repository's OIDC identity and given a SLSA provenance attestation
  # while the other two were still running -- or already red. An operator who verifies
  # that signature gets a valid answer, and a valid answer only ever meant "this
  # repository built this"; it never meant the image was sound. Gating the publish is
  # what makes the signature worth what people read into it.
  tests:
    name: Gate — tests
    uses: ./.github/workflows/tests.yml

  security:
    name: Gate — security scan
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  build-and-push:
    name: Build & Push Docker Image
    needs: [tests, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Vauxtra
            org.opencontainers.image.description=Self-hosted DNS & reverse proxy management panel for homelab
            org.opencontainers.image.url=https://github.com/ptitzgeg-on-git/vauxtra
            org.opencontainers.image.source=https://github.com/ptitzgeg-on-git/vauxtra
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign (keyless / Sigstore)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

      - name: SLSA provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: Create Release
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          body: |
            ## Docker Image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```
