name: Build & Publish

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # `build-and-push` had no `needs:` at all. Tests, Security Scan and this workflow all
  # trigger on the same push and started in parallel, so an image was pushed to `latest`,
  # signed with the repository's OIDC identity and given a SLSA provenance attestation
  # while the other two were still running -- or already red. An operator who verifies
  # that signature gets a valid answer, and a valid answer only ever meant "this
  # repository built this"; it never meant the image was sound. Gating the publish is
  # what makes the signature worth what people read into it.
  tests:
    name: Gate — tests
    uses: ./.github/workflows/tests.yml

  security:
    name: Gate — security scan
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  build-and-push:
    name: Build & Push Docker Image
    needs: [tests, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      # The tag that was actually pushed, which is not the tag that was pushed to git:
      # `type=semver,pattern={{version}}` strips the `v`, so `v1.3.0` publishes `1.3.0`.
      # The release job needs this exact string or it advertises an image nobody can pull.
      image_version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Vauxtra
            org.opencontainers.image.description=Self-hosted DNS & reverse proxy management panel for homelab
            org.opencontainers.image.url=https://github.com/ptitzgeg-on-git/vauxtra
            org.opencontainers.image.source=https://github.com/ptitzgeg-on-git/vauxtra
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless / Sigstore)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

      - name: SLSA provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: Create Release
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          make_latest: true
          body: |
            ## Docker Image

            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.build-and-push.outputs.image_version }}
            ```
