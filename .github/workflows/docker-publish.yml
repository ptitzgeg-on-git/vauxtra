name: Build & Publish

on:
  push:
    # `dev` publishes too, because a staging instance that runs something other than the
    # image this repository builds is not testing this repository. It gets its own moving
    # tag and never touches `latest`, which stays the production pointer.
    branches: [main, dev]
    tags: ["v*.*.*"]

# Never `cancel-in-progress`. Two runs here would be two writers on the same registry tag,
# so they queue instead -- and a run that is already pushing, signing or attesting is
# never the one to kill.
#
# The group is the workflow, with nothing appended. It used to end in `github.ref`, which
# put the two runs that actually collide into two different groups: pushing `main` and
# then tagging that same commit are two refs, one commit, and both runs write `latest`
# and `sha-<short>`. Measured on v1.5.0: the two runs overlapped for four minutes and it
# was the later finisher that set `latest`. Keying on the commit instead would fix that
# pair and still miss two successive pushes to `main`, which also both write `latest`.
# Any two publishes can share a moving tag, so all publishes share one queue. The cost is
# a `dev` push waiting behind a `main` push; a build here runs six to thirteen minutes.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# This workflow used to end with a `release:` job of its own, and that job is the reason
# three release pages on this repository advertise a `docker pull` for an image the
# registry does not have. It ran `softprops/action-gh-release` the moment the build step
# returned, wrote the pull command from a template, and never asked the registry whether
# the tag resolved. It also passed `make_latest: true`, which hands the Latest badge to
# whichever release was created most recently rather than to the highest version -- the
# same mistake that briefly put the badge on the retroactive `v1.0.0`.
#
# Release pages are written by `release.yml` now, which fetches the manifest and every
# platform child before it will print a pull command, and passes `make_latest=legacy` so
# the badge follows the version number. Both workflows still fire on the same tag push;
# this one builds and pushes, that one waits for what this one produced and then
# publishes. One writer per artifact, and the writer checks its own claim.
jobs:
  # `build-and-push` had no `needs:` at all. Tests, Security Scan and this workflow all
  # trigger on the same push and started in parallel, so an image was pushed to `latest`,
  # signed with the repository's OIDC identity and given a SLSA provenance attestation
  # while the other two were still running -- or already red. An operator who verifies
  # that signature gets a valid answer, and a valid answer only ever meant "this
  # repository built this"; it never meant the image was sound. Gating the publish is
  # what makes the signature worth what people read into it.
  tests:
    name: Gate — tests
    uses: ./.github/workflows/tests.yml

  security:
    name: Gate — security scan
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  build-and-push:
    name: Build & Push Docker Image
    needs: [tests, security]
    runs-on: ubuntu-latest
    # A wedged build here does not stall one run, it stalls the branch. This workflow keeps
    # `cancel-in-progress: false` for the reason written above, and it is the only producer
    # of three of the five checks `main` and `dev` require -- `Dependency audit`,
    # `Image build & scan` and `Vulnerability scan (Trivy + Grype)` all reach a push through
    # the gate jobs above and through nothing else. So every later push queues behind this
    # job, unscanned, for as long as it runs. With no ceiling declared that is GitHub's
    # default of six hours: `06a90ed` sat in `Build and push` for 48 minutes against a
    # measured 402 seconds, with two runs stacked behind it, and would have held the queue
    # until morning. The number is deliberately far above the measurement -- a ceiling that
    # trips on a slow-but-healthy run costs more than it saves.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            # The staging pointer. Written by name rather than by `type=ref,event=branch`,
            # which would also start publishing a `main` tag that nothing pulls and that the
            # weekly cleanup would then have to learn about.
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Only on `main`. Without the `enable=`, every ref carrying the commit wrote
            # this same tag -- and the builds differ: `APP_VERSION` is `latest` on main,
            # `dev` on dev, `1.5.0` on a tag, so the digests differ too. The second run
            # repointed the crumb and left the first image nameless, which handed it,
            # with its cosign signature and its SLSA attestation, to `delete-untagged`
            # in the weekly cleanup. A `dev` or tag build needs no crumb: `dev` is the
            # moving pointer, a release has its semver, and both carry the commit in
            # `org.opencontainers.image.revision` anyway.
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Vauxtra
            org.opencontainers.image.description=Self-hosted DNS & reverse proxy management panel for homelab
            org.opencontainers.image.url=https://github.com/ptitzgeg-on-git/vauxtra
            org.opencontainers.image.source=https://github.com/ptitzgeg-on-git/vauxtra
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless / Sigstore)
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository }}@${{ steps.push.outputs.digest }}

      - name: SLSA provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

