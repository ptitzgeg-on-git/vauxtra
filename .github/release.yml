# Categories for the "What's Changed" block GitHub generates from merged pull requests.
# The release workflow asks for these notes through the API, so this file is what decides
# whether a release page reads as a changelog or as an undifferentiated list of titles.
#
# Matching is by label first, then by author. A pull request lands in the first category
# whose rule it satisfies, so order matters: `security` sits above `fixes` because a
# security fix labelled both should be read as security.
changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security
      labels:
        - security
    - title: Breaking changes
      labels:
        - breaking

    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Providers
      labels:
        - provider
    - title: Documentation
      labels:
        - documentation
    - title: Continuous integration
      labels:
        - ci
        - build

    - title: Dependencies
      labels:
        - dependencies

    # Anything that reached `main` without a label still has to appear. A release note
    # that silently drops a change is worse than an untidy one.
    - title: Other changes
      labels:
        - "*"
